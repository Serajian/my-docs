server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # مارک‌داون: نوع درست + همیشه revalidate
    # بدون این، مرورگر _sidebar.md کش‌شده را نگه می‌دارد و
    # صفحه‌های تازه در منو دیده نمی‌شوند.
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
