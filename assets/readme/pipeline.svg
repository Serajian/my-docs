<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="290" viewBox="0 0 1200 290"
     role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">مسیر انتشار my-docs</title>
  <desc id="pipeDesc">چهار مرحله از راست به چپ: نوشتن مارک‌داون در docs، پوش به گیت و بیلد خودکار در Dokploy، سرو شدن با ایمیج nginx:alpine، و دسترسی امن از طریق Cloudflare Tunnel و Tailscale.</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="24" fill="#0c0f10" stroke="#1d2425" stroke-width="1.5"/>

  <!-- heading -->
  <rect x="1140" y="30" width="4" height="34" fill="#42b983"/>
  <text x="1120" y="58" direction="rtl" text-anchor="start"
        font-family="Vazirmatn, Tahoma, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="700" fill="#eef2f1">مسیر انتشار</text>

  <g font-family="Vazirmatn, Tahoma, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <!-- ۱ — نوشتن -->
    <g id="stage-write">
      <rect x="898" y="96" width="246" height="132" rx="14" fill="#14191a" stroke="#232b2c" stroke-width="1.5"/>
      <rect x="1128" y="112" width="3" height="100" fill="#42b983"/>
      <text x="918" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#46534f">01</text>
      <text x="1124" y="136" direction="rtl" text-anchor="start" font-size="24" font-weight="600" fill="#eef2f1">نوشتن</text>
      <text x="1124" y="174" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b9a97">docs/*.md</text>
      <text x="1124" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#62716d">_sidebar.md</text>
    </g>

    <path d="M894 162 H878" stroke="#42b983" stroke-width="2"/>
    <polygon points="868,162 879,156.5 879,167.5" fill="#42b983"/>

    <!-- ۲ — پوش و بیلد -->
    <g id="stage-build">
      <rect x="618" y="96" width="246" height="132" rx="14" fill="#14191a" stroke="#232b2c" stroke-width="1.5"/>
      <rect x="848" y="112" width="3" height="100" fill="#42b983"/>
      <text x="638" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#46534f">02</text>
      <text x="844" y="136" direction="rtl" text-anchor="start" font-size="24" font-weight="600" fill="#eef2f1">پوش و بیلد</text>
      <text x="844" y="174" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b9a97">git push</text>
      <text x="844" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#62716d">Dokploy</text>
    </g>

    <path d="M614 162 H598" stroke="#42b983" stroke-width="2"/>
    <polygon points="588,162 599,156.5 599,167.5" fill="#42b983"/>

    <!-- ۳ — سرو استاتیک -->
    <g id="stage-serve">
      <rect x="338" y="96" width="246" height="132" rx="14" fill="#14191a" stroke="#232b2c" stroke-width="1.5"/>
      <rect x="568" y="112" width="3" height="100" fill="#42b983"/>
      <text x="358" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#46534f">03</text>
      <text x="564" y="136" direction="rtl" text-anchor="start" font-size="24" font-weight="600" fill="#eef2f1">سرو استاتیک</text>
      <text x="564" y="174" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b9a97">nginx:alpine</text>
      <text x="564" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#62716d">docsify 4</text>
    </g>

    <path d="M334 162 H318" stroke="#42b983" stroke-width="2"/>
    <polygon points="308,162 319,156.5 319,167.5" fill="#42b983"/>

    <!-- ۴ — دسترسی امن -->
    <g id="stage-access">
      <rect x="58" y="96" width="246" height="132" rx="14" fill="#14191a" stroke="#232b2c" stroke-width="1.5"/>
      <rect x="288" y="112" width="3" height="100" fill="#42b983"/>
      <text x="78" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#46534f">04</text>
      <text x="284" y="136" direction="rtl" text-anchor="start" font-size="24" font-weight="600" fill="#eef2f1">دسترسی امن</text>
      <text x="284" y="174" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b9a97">Cloudflare Tunnel</text>
      <text x="284" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#62716d">Tailscale</text>
    </g>

    <text x="1120" y="260" direction="rtl" text-anchor="start" font-size="19" fill="#6b7a76">هیچ مرحله‌ی بیلدی وجود ندارد — docsify مارک‌داون را در مرورگر رندر می‌کند</text>
  </g>
</svg>
